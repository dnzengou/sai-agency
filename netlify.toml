# Netlify configuration for sai-agency.
# The production build output is committed at the repo root (index.html,
# assets/), so we publish the root directly — portable across any CI host
# (the previous config pinned an absolute Windows path that only existed on one
# machine and would fail Netlify's Linux build).

[build]
publish = "."

# Serverless functions. `submission-created` is triggered automatically by
# Netlify Forms on every form submission — it bridges leads into the KafCa
# stream (see netlify/functions/submission-created.mjs).
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# Homepage: the Deal Radar IS the landing page now. The old marketing SPA
# (index.html) was renamed to agency.html and demoted to /agency, so the site
# focuses primarily on helping users source deals (businesses, property and
# ventures). With no index.html present, this rewrite serves `/` directly.
[[redirects]]
from = "/"
to = "/deals.html"
status = 200
force = false

# Deal Radar page.
[[redirects]]
from = "/deals"
to = "/deals.html"
status = 200
force = false

# Succession & repopulation demo landing.
[[redirects]]
from = "/demo"
to = "/demo.html"
status = 200
force = false

# Matchmaking page.
[[redirects]]
from = "/match"
to = "/match.html"
status = 200
force = false

# Full-service marketing page — demoted from the homepage but preserved
# (renamed index.html -> agency.html) and reachable at /agency.
[[redirects]]
from = "/agency"
to = "/agency.html"
status = 200
force = false

[[redirects]]
from = "/agency/*"
to = "/agency.html"
status = 200
force = false

# Catch-all: any unknown route lands on the Deal Radar (the primary product),
# not the hidden marketing SPA. Netlify serves existing static files and the
# implicit /foo -> /foo.html pretty-URLs before this non-forced rewrite fires,
# so real pages (/countries, /deals/<id>, /country/<slug>, assets) are unaffected.
[[redirects]]
from = "/*"
to = "/deals.html"
status = 200
force = false

# --- Security response headers (production hardening) ---
# Cheap, high-value hardening for a static site. Surfaced by the VulnRedTeam
# agent; applied here so the live site ships them on the next deploy.
[[headers]]
for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(), camera=()"
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# Long-cache fingerprinted build assets.
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
