name: ntfy-push-digest

# Lightweight push digest via ntfy.sh (or a self-hosted ntfy server).
# No SMTP, no mailing list — users subscribe to topics in the ntfy app.
#
# Topics and groupings are defined in agents/sai_agents/digest/ntfy.py:SLICES.
# The job runs every Monday morning; it's safe to also trigger manually.
#
# Opt-in via secrets:
#   SAI_NTFY_SERVER        — e.g. https://ntfy.sh or your self-hosted URL.
#                            When unset, the step stays in dry-run and
#                            uploads a preview artifact instead of sending.
#   SAI_NTFY_TOPIC_PREFIX  — optional (default: sai-deals-v1).
#   SAI_NTFY_TOKEN         — optional bearer for protected topics.

on:
  schedule:
    - cron: "45 7 * * 1"  # Mondays 07:45 UTC — just after the main deal refresh
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no POSTs, upload preview artifact only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ntfy-push-digest
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    env:
      SAI_NTFY_SERVER: ${{ secrets.SAI_NTFY_SERVER }}
      SAI_NTFY_TOPIC_PREFIX: ${{ secrets.SAI_NTFY_TOPIC_PREFIX }}
      SAI_NTFY_TOKEN: ${{ secrets.SAI_NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Push digest to ntfy (or dry-run)
        working-directory: ${{ github.workspace }}
        run: |
          flag=""
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$SAI_NTFY_SERVER" ]; then
            flag="--dry-run"
          fi
          python -m sai_agents.digest.ntfy_send deals.json $flag
        env:
          PYTHONPATH: ${{ github.workspace }}/agents
      - name: Upload dry-run preview (when not sending)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-preview
          path: ntfy-preview.json
          if-no-files-found: ignore
