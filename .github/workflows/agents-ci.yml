name: agents-ci

on:
  push:
    paths:
      - "agents/**"
      - ".github/workflows/agents-ci.yml"
  pull_request:
    paths:
      - "agents/**"
      - ".github/workflows/agents-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-run the team (local fallback, no Kafka)
        env:
          SAI_TARGET_URL: https://example.com
        run: python -m sai_agents.run_team
