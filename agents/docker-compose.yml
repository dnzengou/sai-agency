# Local prod-like stack: Kafka + Zookeeper + the SAI Agents team.
# Usage:
#   docker compose up --build
# The `agents` service waits for Kafka, then publishes evolution events to the
# `claw-evolution-events` topic (event sourcing + impact + Bl guards active).

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12

  agents:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: claw-evolution-events
      KAFKA_ENABLED: "true"
      SAI_TARGET_URL: https://sai-agency.netlify.app
      SAI_LOG_JSON: "true"
      SAI_METRICS_ENABLED: "true"
      SAI_METRICS_PORT: "9464"
    ports:
      - "9464:9464"  # Prometheus metrics
    # Run the full orchestrated team against the live site.
    command: ["python", "-m", "sai_agents.run_team"]
    restart: "no"
